name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Make app icon and splash from the site icon
        continue-on-error: true
        run: |
          mkdir -p assets
          curl -L -o assets/logo.png https://heaven-bd.vercel.app/icon-512.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
      - run: bash patch-native.sh && npx cap sync android
      - name: Use the permanent signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk HEAVEN.apk && zip HEAVEN.zip HEAVEN.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HEAVEN-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (permanent download link for in-app update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: HEAVEN v${{ github.run_number }}
          files: |
            HEAVEN.apk
            HEAVEN.zip
